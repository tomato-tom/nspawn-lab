# /etc/lighttpd/lighttpd.conf
# Git server using git-http-backend over HTTP

server.document-root = "/var/www/html"
server.port = 80
server.username = "www-data"
server.groupname = "www-data"

# Required modules for CGI and Git HTTP backend
server.modules += ("mod_cgi", "mod_alias", "mod_rewrite", "mod_setenv")

# Rewrite Git Smart HTTP protocol requests to the backend
url.rewrite-once = (
    "^/git/(.*/git-upload-pack)$" => "/git/$1",   # git fetch/pull
    "^/git/(.*/git-receive-pack)$" => "/git/$1",  # git push
    "^/git/(.*/info/refs)$" => "/git/$1",         # Repository discovery
    "^/git/(.*/HEAD)$" => "/git/$1"               # HEAD reference
)

# Handle all /git/ URLs
$HTTP["url"] =~ "^/git" {
    # Map /git/ to the Git HTTP backend CGI
    alias.url += ( "/git" => "/usr/lib/git-core/git-http-backend" )
    cgi.assign = ( "" => "" )

    # Environment variables for Git backend
    setenv.set-environment = (
        "GIT_PROJECT_ROOT" => "/var/www/git",   # Parent directory of repos
        "GIT_HTTP_EXPORT_ALL" => "1",           # Allow access to all repos
        "REMOTE_USER" => "dummy"                # Required for push operations
    )
}
