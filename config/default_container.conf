# config/default_conteiner.conf

# ==================== コンテナ設定 ====================
CONTAINER_NAME="paw-1"
CONTAINER_ROOT_DIR="/var/lib/machines/${CONTAINER_NAME}"
CONTAINER_VETH="en0"
CONTAINER_IP="192.168.234.101"
CONTAINER_NETMASK="24"
CONTAINER_GATEWAY="192.168.234.1"
CONTAINER_DNS="$CONTAINER_GATEWAY"

# ==================== ブリッジ設定 ====================
BRIDGE_NAME="pawbr0"
BRIDGE_IP="192.168.234.1"
BRIDGE_NETMASK="24"
BRIDGE_NETWORK="192.168.234.0/24"
BRIDGE_NAT=true
BRIDGE_VETH="ve-${CONTAINER_NAME}"    # ホスト側vethインターフェース

# ==================== システム設定 ====================
CPU_QUOTA="80%"
MEMORY_LIMIT="512M"
BIND_MOUNTS=(
    "/home/share:/home/share:rw"
)

# ==================== 環境変数設定 ====================
ENVIRONMENT_VARS=(
    "LANG=en_US.UTF-8"
    "TZ=UTC
)

